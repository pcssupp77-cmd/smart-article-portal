<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Article Portal | Hindi & English Guides</title>
<meta name="description" content="Explore useful Hindi and English articles about technology, business, education and practical guides.">
<link rel="canonical" href="https://smart-article-portal.pages.dev/">
<meta property="og:type" content="website"><meta property="og:title" content="Smart Article Portal"><meta property="og:url" content="https://smart-article-portal.pages.dev/">
<style>
:root{--bg:#f5f7fb;--fg:#17202e;--card:#fff;--ac:#10213a;--mut:#5b6678;--bd:#dde3ee}
@media(prefers-color-scheme:dark){:root{--bg:#0d1420;--fg:#e8edf6;--card:#16202f;--ac:#7fb0ff;--mut:#9aa7bb;--bd:#26344a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--fg)}
header{background:#10213a;color:#fff;padding:14px 16px}header h1{margin:0;font-size:1.3rem}header p{margin:2px 0 0;opacity:.8;font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
button,input{font:inherit;border-radius:8px;border:1px solid var(--bd)}button{padding:6px 12px;background:var(--card);color:var(--fg);cursor:pointer}
button[aria-pressed=true]{background:#2f6fed;color:#fff;border-color:#2f6fed}
input{flex:1;padding:8px 10px;background:var(--card);color:var(--fg);min-width:0}
main{max-width:900px;margin:0 auto;padding:16px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.grid{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card h3{margin:4px 0}.card a,.back{color:var(--ac);text-decoration:none}.meta{color:var(--mut);font-size:.85rem}
.msg{padding:24px;text-align:center;color:var(--mut)}article p{margin:0 0 1em}.tag{display:inline-block;margin:0 6px 6px 0;padding:2px 8px;border:1px solid var(--bd);border-radius:99px;font-size:.8rem}
footer{max-width:900px;margin:0 auto;padding:16px;color:var(--mut);font-size:.9rem}footer a{color:var(--ac);margin-right:12px}
</style>
</head>
<body>
<header>
<h1>Smart Article Portal</h1><p data-i="tag"></p>
<div class="bar" role="group" aria-label="Language"><button class="lb" data-l="en">English</button><button class="lb" data-l="hi">हिंदी</button>
<input id="q" type="search"></div>
</header>
<main>
<section id="list"><h2 data-i="h"></h2><div id="chips" class="chips" role="group" aria-label="Categories"></div><div id="cards" class="grid" aria-live="polite"></div></section>
