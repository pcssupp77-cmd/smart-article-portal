name: AI Article Generator

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Articles to generate (1-3)"
        default: "1"
  schedule:
    # 12:30 UTC = 18:00 IST. FreeTheAi needs a Discord /checkin each UTC day (starts 05:30 IST), so check in before 18:00 IST.
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: article-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate articles
        env:
          FREETHEAI_API_KEY: ${{ secrets.FREETHEAI_API_KEY }}
          FREETHEAI_MODEL: ${{ vars.FREETHEAI_MODEL }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.count || vars.ARTICLES_PER_DAY || '1' }}
        run: python scripts/generate_article.py
      - name: Validate articles.json
        run: python -c "import json; d=json.load(open('articles.json',encoding='utf-8')); print('valid JSON')"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if git diff --cached --quiet; then echo "No changes to commit"; else
            git commit -m "Add AI-generated article(s)"
            git push
          fi
