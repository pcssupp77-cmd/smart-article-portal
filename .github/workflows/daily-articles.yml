name: AI Article Generator

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "30 8 * * *"   # 14:00 IST
  workflow_dispatch:
    inputs:
      posts:
        description: "How many posts to create"
        default: "5"

permissions:
  contents: write

concurrency:
  group: article-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate posts
        env:
          POSTS_PER_RUN: ${{ github.event.inputs.posts || '3' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREETHEAI_API_KEY: ${{ secrets.FREETHEAI_API_KEY }}
          ADSENSE_ID: ${{ secrets.ADSENSE_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SITE_URL: https://smart-article-portal.pages.dev
          SITE_NAME: Smart Article Portal
          TRENDS_GEO: IN
        run: python scripts/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto posts $(date -u +%F-%H%M)" && git push)
